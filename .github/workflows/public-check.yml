# This repository is public. See AGENTS.md.
name: public-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            range=HEAD
          else
            range="$from..HEAD"
          fi
          git log --format=%B "$range" | node scripts/public-check.mjs --stdin
