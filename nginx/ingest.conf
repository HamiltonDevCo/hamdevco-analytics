# ---------------------------------------------------------------------------
# PostHog same-origin ingest. Include inside a server { } block.
#
# WHY SAME-ORIGIN AT ALL. This is the single mechanism that makes PostHog worth
# deploying over GA4 on these sites. GA4's client id comes from the `_ga` cookie
# written by gtag.js loaded from googletagmanager.com, which content blockers drop
# outright — so GA4 silently under-reports every blocked visitor. Served from the
# site's own origin under /ingest, PostHog's requests are indistinguishable from
# the site's own and its first-party cookie is written normally.
#
# Shipping PostHog through GTM would re-inherit the exact loss this avoids.
# ---------------------------------------------------------------------------

# Runtime DNS. REQUIRED, and not optional the way it looks.
# nginx resolves a LITERAL hostname in proxy_pass once, at config load, and then
# caches that address forever. Both PostHog hosts sit behind a CDN whose addresses
# rotate, so a literal upstream works until the address changes and then fails
# permanently until someone reloads nginx. Using a variable forces a runtime
# lookup, which is why the two `set` lines below exist.
resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
resolver_timeout 5s;

# TWO UPSTREAMS, NOT ONE, and they are not interchangeable.
# us-assets serves the static bundles — array.js, and critically the session
# replay recorder. us.i receives the events. Point both at the ingest host and the
# recorder 404s, which switches session replay off while ordinary capture keeps
# working: a partial failure that reads as "replay isn't enabled yet".
set $ph_ingest "us.i.posthog.com";
set $ph_assets "us-assets.i.posthog.com";

# THE `^~` ON BOTH LOCATIONS IS LOAD-BEARING. Do not drop it.
# nginx matches a REGEX location before a plain prefix location, and almost every
# site in the fleet has a static-asset block like:
#     location ~* \.(js|css|png|woff2)$ { expires 30d; ... }
# Without `^~`, that regex wins for /ingest/static/array.js and every other .js
# under /ingest, and nginx serves them from the filesystem root — a 404 for the
# posthog bundle and the session-replay recorder, while extensionless paths like
# /ingest/e/ keep working. The result is a half-working install: capture appears
# fine, replay and surveys are silently dead. `^~` tells nginx to stop at the
# prefix match and never consider the regexes.

# Static bundles. Must come first — it is the more specific prefix.
location ^~ /ingest/array/ {
    rewrite ^/ingest/array/(.*)$ /array/$1 break;
    proxy_pass https://$ph_assets;

    proxy_set_header Host $ph_assets;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_cache_valid 200 1h;
    proxy_ssl_verify off;
}

location ^~ /ingest/static/ {
    rewrite ^/ingest/static/(.*)$ /static/$1 break;
    proxy_pass https://$ph_assets;

    proxy_set_header Host $ph_assets;
    # Without SNI the TLS handshake to a CDN fails outright.
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_cache_valid 200 1h;
    proxy_ssl_verify off;
}

# Event ingest, session replay payloads, feature flag requests.
location ^~ /ingest/ {
    rewrite ^/ingest/(.*)$ /$1 break;
    proxy_pass https://$ph_ingest;

    proxy_set_header Host $ph_ingest;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # WITHOUT THESE, EVERY EVENT CARRIES THE PROXY'S IP.
    # PostHog derives country, region and city from the request address. Omit the
    # forwarded headers and every visitor in the project resolves to whichever
    # datacentre the container runs in — the geo breakdown does not error, it just
    # reports one city for the entire client base. On sites whose whole value is
    # local search, that is the breakdown that matters most.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_ssl_verify off;

    # Replay payloads are large and arrive as beacons; don't make the client wait.
    proxy_buffering off;
    client_max_body_size 20m;
}

# ---------------------------------------------------------------------------
# VERIFY WITH A BROWSER. NEVER WITH CURL.
#
# posthog-js POSTs to paths ending in a slash, using fetch(keepalive) and
# navigator.sendBeacon. If anything in front answers those with a 3xx to the
# slashless form, BROWSERS DROP THE REQUEST BODY on the redirect hop. `curl -L`
# re-sends it and reports success — so curl will confirm a proxy that is
# discarding every real event.
#
# Measured at Ridgerunner 2026-08-17: in one 15-minute window the WAF log held
# 6 event POSTs and 10 replay POSTs from a real browser, and a ClickHouse query
# over the same window returned only the ones curl had sent. Session replay had
# never worked on any deploy, and nothing anywhere reported a failure.
#
# The acceptance test is: click through the deployed site in a real browser, then
# query the project for events from that $host in the last five minutes.
# ---------------------------------------------------------------------------
